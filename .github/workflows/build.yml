name: Build Windows app
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install castLabs EVS (only when secrets are set)
        if: env.EVS_ACCOUNT_NAME != ''
        run: pip install --upgrade castlabs-evs
      - run: npm ci
      - name: Build installer + portable zip
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Amplite-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Amplite v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Download `Amplite-Setup-${{ steps.ver.outputs.v }}.exe` below and run it.**
            First time? Add `http://127.0.0.1:43821/` as a Redirect URI in your Spotify developer dashboard.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/latest.yml
