name: Build Windows app
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install castLabs EVS (only when secrets are set)
        if: env.EVS_ACCOUNT_NAME != ''
        run: pip install --upgrade castlabs-evs
      - name: Cache audio engine (librespot)
        id: lrs
        uses: actions/cache@v4
        with:
          path: bin/librespot.exe
          key: librespot-0.8.0-win-x64-nativetls-rodio-lto-${{ hashFiles('patches/**') }}
      - name: Build audio engine (librespot 0.8.0 + Amplite patches)
        if: steps.lrs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v0.8.0 https://github.com/librespot-org/librespot lrs-src
          cd lrs-src
          for p in ../patches/*.patch; do git apply "$p"; done
          # Smaller, faster engine: full LTO, single codegen unit, symbols stripped.
          export CARGO_PROFILE_RELEASE_LTO=fat CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1 CARGO_PROFILE_RELEASE_STRIP=symbols
          cargo build --release --locked --no-default-features --features "native-tls,rodio-backend"
          mkdir -p ../bin && cp target/release/librespot.exe ../bin/
      - name: Check engine
        shell: bash
        run: ls -la bin && ./bin/librespot.exe --version
      - run: npm ci
      - name: Build installer + portable zip
        run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Amplite-Windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Amplite v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Download `Amplite-Setup-${{ steps.ver.outputs.v }}.exe` below and run it.**
            First time? Add `http://127.0.0.1:43821/callback` as a Redirect URI in your Spotify developer dashboard.
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/*.zip
            dist/latest.yml
